<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定时采集与待办</title><script src="/static/workspace-theme.js"></script><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/workspace.css"><link rel="stylesheet" href="/static/operations.css">  <link rel="icon" href="/static/platform-brand.svg?v=20261022-brand">
</head><body><aside class="sidebar"><div class="brand"><span class="brand-icon"><img src="/static/platform-brand.svg" alt="" width="32" height="32"></span>定时采集与待办</div><nav class="nav"><a class="navlink" href="/">返回工作台</a><a href="/operations" class="navlink active">采集计划与待办</a></nav><div class="sidebar-bottom">后台持续检查 · 当前账号隔离</div></aside><main class="main"><header class="topbar"><strong id="platform-name">定时采集与待办</strong><span id="account-name"></span></header><section class="content"><div class="pagehead"><div><h1>定时采集与待办</h1><p class="subtitle">定时读取关键词结果或评论，把新增内容汇总成可处理的待办。</p></div><button id="refresh">刷新结果</button></div><div id="notice" role="status"></div><div id="error" role="alert"></div><section class="panel"><div class="panelbody"><p id="purpose">读取已保存的采集计划，不会在打开页面时请求平台。</p><p id="worker-status" role="status">正在检查后台服务…</p><p id="capability-note" class="hint"></p><p id="account-help" hidden>先<a href="/#account">连接平台账号</a>，再创建采集计划。</p></div></section><div id="summary" class="stats"></div><section class="panel"><div class="panelhead"><h2>创建采集计划</h2></div><form id="plan-form" class="panelbody"><div class="formgrid"><label>计划名称<input name="name" maxlength="80" required placeholder="如：跑步内容观察"></label><label>任务类型<select name="kind" id="kind"></select></label><label class="wide">关键词或目标链接<input name="target" required maxlength="500" placeholder="关键词采集填关键词；评论监听填原文链接"></label><label>检查间隔<select name="interval"><option value="1800">每 30 分钟</option><option value="3600">每小时</option><option value="21600">每 6 小时</option><option value="86400">每天</option><option value="300">每 5 分钟</option></select></label></div><div class="form-actions"><small>保存后暂停。先立即检查一次，再启动定时采集。</small><button class="primary">保存计划</button></div></form></section><section class="panel"><div class="panelhead"><h2>采集计划</h2></div><div id="plans" class="panelbody">正在读取本地计划…</div></section><section class="panel"><div class="panelhead"><h2>待处理区</h2><small>最多显示 100 条，待处理优先</small><select id="event-filter" aria-label="筛选处理状态"><option value="new">待处理</option><option value="all">全部</option></select></div><div id="events" class="panelbody"></div></section><section class="panel" id="comment-panel"><div class="panelhead"><h2>评论草稿与提交记录</h2></div><div id="comments" class="panelbody"></div></section><section class="panel"><div class="panelhead"><h2>最近执行</h2></div><div id="runs" class="panelbody"></div></section><p class="hint">暂停会停止后续检查；已开始的平台读取可能仍会完成。Agent 分析提供建议，评论发布需要单独确认。</p><p id="capabilities" class="hint"></p></section></main><dialog id="review-dialog"><form method="dialog"><button aria-label="关闭">关闭</button></form><div id="review-content"></div></dialog><script type="module" src="/static/operations.js"></script><script type="module" src="/static/workspace-ui.js"></script></body></html>
